<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ココシカ - 歯科国試対策</title>
  <link rel="stylesheet" href="css/style.css?v=47">
</head>
<body>
  <div class="app">
    <!-- ヘッダー（タブ統合） -->
    <header class="header">
      <button id="menu-btn" class="menu-btn" aria-label="メニュー">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <h1 class="header-title">ココシカ</h1>
      <div class="header-spacer"></div>
    </header>

    <!-- サイドバー -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">トピック一覧</span>
        <button id="sidebar-close" class="sidebar-close">✕</button>
      </div>
      <div class="sidebar-search">
        <input type="text" id="sidebar-filter" placeholder="検索...">
      </div>
      <div class="sidebar-home">
        <button id="home-btn" class="home-btn">ホーム</button>
      </div>
      <nav class="topic-list" id="topic-list">
        <!-- 動的に生成 -->
      </nav>
    </aside>

    <!-- サイドバーオーバーレイ -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- 検索オーバーレイ -->
    <div id="search-overlay" class="search-overlay">
      <div class="search-modal">
        <div class="search-modal-header">
          <input type="text" id="search-input" placeholder="トピックを検索..." autofocus>
          <button id="close-search" class="close-search-btn">✕</button>
        </div>
        <div class="search-results" id="search-results">
          <!-- 検索結果 -->
        </div>
      </div>
    </div>

    <!-- メインコンテンツ -->
    <main class="main-content">
      <div class="content-area">
        <div class="tab-content active" id="html-content">
          <div class="welcome-screen" id="welcome-screen">
            <div class="welcome-header">
              <h1 class="welcome-title">ココシカ</h1>
              <p class="welcome-subtitle">歯科国試対策</p>
            </div>

            <div class="welcome-cards">
              <div class="welcome-card" id="welcome-card-menu">
                <div class="welcome-card-icon">
                  <div class="welcome-icon-menu">
                    <span></span>
                    <span></span>
                    <span></span>
                  </div>
                </div>
                <div class="welcome-card-content">
                  <h3>トピックを選ぶ</h3>
                  <p>左上のメニューから<br>学習したいトピックを選択</p>
                </div>
              </div>

              <div class="welcome-card">
                <div class="welcome-card-icon">
                  <span class="welcome-icon-tab">まとめ</span>
                </div>
                <div class="welcome-card-content">
                  <h3>まとめで学ぶ</h3>
                  <p>まとめ資料で<br>知識をインプット</p>
                </div>
              </div>

              <div class="welcome-card">
                <div class="welcome-card-icon">
                  <span class="welcome-icon-tab">Q&A</span>
                </div>
                <div class="welcome-card-content">
                  <h3>Q&Aで確認</h3>
                  <p>一問一答形式で<br>理解度をチェック</p>
                </div>
              </div>

              <div class="welcome-card">
                <div class="welcome-card-icon">
                  <span class="welcome-icon-tab">過去問</span>
                </div>
                <div class="welcome-card-content">
                  <h3>過去問に挑戦</h3>
                  <p>国試過去問で<br>実力をテスト</p>
                </div>
              </div>
            </div>

            <div class="welcome-tips">
              <p>← スワイプでタブ切り替え →</p>
            </div>

            <button class="welcome-start-btn" id="welcome-start-btn">
              はじめる
            </button>
          </div>
          <iframe id="html-frame" style="display:none;"></iframe>
        </div>
        <div class="tab-content" id="qa-content">
          <div class="placeholder">
            <p>Q&Aを表示するにはトピックを選択</p>
          </div>
          <div id="qa-toolbar" class="qa-toolbar" style="display:none;">
            <button id="qa-toggle-btn" class="qa-toggle-btn">全て表示</button>
          </div>
          <div id="qa-display" class="qa-display" style="display:none;"></div>
        </div>
        <div class="tab-content" id="kakomon-content">
          <div class="placeholder" id="kakomon-placeholder">
            <p>過去問を表示するにはトピックを選択</p>
          </div>
          <div id="kakomon-toolbar" class="kakomon-toolbar" style="display:none;">
            <span class="kakomon-progress"><span id="kakomon-current">0</span> / <span id="kakomon-total">0</span></span>
            <button id="kakomon-reset" class="kakomon-btn">リセット</button>
          </div>
          <div id="kakomon-display" class="kakomon-display" style="display:none;"></div>
        </div>
      </div>
    </main>

    <!-- フローティングタブバー -->
    <nav class="floating-tabbar">
      <button class="floating-tab active" data-tab="html">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
          <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
        </svg>
        <span>まとめ</span>
      </button>
      <button class="floating-tab" data-tab="qa">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
          <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
        <span>Q&A</span>
      </button>
      <button class="floating-tab" data-tab="kakomon">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
        </svg>
        <span>過去問</span>
      </button>
    </nav>

  </div>

  <script src="js/data.js?v=3"></script>
  <script src="js/search.js?v=1"></script>
  <script src="js/kakomon.js?v=2"></script>
  <script src="js/app.js?v=54"></script>
</body>
</html>
