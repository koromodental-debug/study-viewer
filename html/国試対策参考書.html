    .topbar {

    .progress-bar { width: 120px; height: 6px; background: var(--bg-secondary); border-radius: 3px; overflow: hidden; }

    .content { padding: 30px; max-width: 1200px; margin: 0 auto; }

    .content th, .content td { padding: 10px 12px; text-align: left; border-bottom: 1px solid var(--border); }

    .content .point-box { background: var(--blue-bg); border-top: 3px solid var(--blue-border); border-bottom: 3px solid var(--blue-border); padding: 15px 20px; margin: 20px 0; break-inside: avoid; }
    .content .point-box-title { font-weight: 600; color: var(--accent); margin-bottom: 10px; }
    .content .question-box { background: var(--yellow-bg); border-left: 4px solid var(--yellow-border); padding: 15px 20px; margin: 20px 0; border-radius: 0 8px 8px 0; break-inside: avoid; }
    .content .q-number { font-weight: 600; color: #744210; margin-bottom: 8px; }

    .content .summary-box { background: var(--blue-bg); border-top: 3px solid var(--blue-border); border-bottom: 3px solid var(--blue-border); padding: 15px 20px; margin: 20px 0; break-inside: avoid; }
    .content .summary-box-title { font-weight: 600; color: var(--accent); margin-bottom: 10px; }
    .content ul { padding-left: 20px; margin: 10px 0; }

    .welcome { text-align: center; padding: 60px 40px; }
    .welcome h1 { font-size: 36px; margin-bottom: 10px; }

    .welcome .blueprint-row .bar-fill.hisshu { background: var(--hisshu); }
    .welcome .blueprint-row .bar-fill.souron { background: var(--souron); }
    .welcome .blueprint-row .bar-fill.kakuron { background: var(--kakuron); }
    .welcome .blueprint-row .ratio { font-size: 14px; font-weight: 600; width: 60px; text-align: right; }

    .stats { display: flex; justify-content: center; gap: 40px; margin-bottom: 40px; }

    .quick-links { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; max-width: 900px; margin: 0 auto; }
    .quick-link { background: var(--bg-secondary); padding: 15px; border-radius: 12px; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; }
    .quick-link:hover { transform: translateY(-3px); box-shadow: 0 10px 30px var(--shadow); }
    .quick-link h3 { font-size: 14px; margin-bottom: 4px; }
    .quick-link h3::before { content: none; }
    .quick-link p { font-size: 11px; color: var(--text-secondary); }

    @media (max-width: 900px) {
      .sidebar { transform: translateX(-100%); transition: transform 0.3s; }
      .sidebar.open { transform: translateX(0); }
      .main { margin-left: 0; }
      .menu-toggle { display: block; }
      .content-body { column-count: 1; }
      .overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); z-index: 99; }
      .overlay.active { display: block; }
    }
  </style>

<body>
  <div class="app">
    <div class="overlay" onclick="toggleSidebar()"></div>
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>📚 歯科国試対策</h1>
        <p>参考書アプリ</p>
        <span class="blueprint-badge">ブループリント準拠</span>

        <input type="text" id="searchInput" placeholder="キーワード検索..." oninput="handleSearch(this.value)">

  </div>
  <script>
const contentData = {
  "医の倫理と歯科医師のプロフェッショナリズム": {
    title: `医の倫理と歯科医師のプロフェッショナリズム`,
    category: `必修01 医の倫理とプロフェッショナリズム`,
    mainCategory: `必修`,
    ratio: `約22%`,
    content: `<h1>1. 医の倫理と歯科医師のプロフェッショナリズム</h1>
    <div class="subtitle">必修の基本的事項 ｜ 出題割合: 約2%</div>
    <div class="container">

      <h3>医の倫理に関する宣言・綱領</h3>
      <table>
        <tr><th>宣言・綱領</th><th>年</th><th>内容</th></tr>
        <tr><td><span class="highlight">ニュルンベルグ綱領</span></td><td>1947</td><td class="red">被験者の自発的同意（人体実験の倫理）</td></tr>
        <tr><td><span class="highlight">ジュネーブ宣言</span></td><td>1948</td><td class="red">医師の職業倫理</td></tr>
        <tr><td><span class="highlight">ヘルシンキ宣言</span></td><td>1964</td><td class="red">人を対象とする医学研究の倫理</td></tr>
        <tr><td>シドニー宣言</td><td>1968</td><td>臓器移植における<span class="red">死の定義</span></td></tr>
        <tr><td>アルマ・アタ宣言</td><td>1978</td><td>プライマリヘルスケア</td></tr>
        <tr><td><span class="highlight">リスボン宣言</span></td><td>1981</td><td class="red">患者の権利</td></tr>
      </table>

      <div class="question-box">
        <div class="q-number">118A-13</div>
        <p>人を対象とする医学研究の倫理を示したのはどれか。2つ選べ。</p>
        <p>a: シドニー宣言　b: ジュネーブ宣言　c: ヘルシンキ宣言　d: ニュルンベルグ綱領　e: ヒポクラテスの誓い</p>
        <div class="answer">正解: c, d</div>
      </div>

      <div class="question-box">
        <div class="q-number">116A-10</div>
        <p>医師の職業倫理を示したのはどれか。2つ選べ。</p>
        <p>a: オタワ憲章　b: シドニー宣言　c: ジュネーブ宣言　d: ヘルシンキ宣言　e: ヒポクラテスの誓い</p>
        <div class="answer">正解: c, e</div>
      </div>

      <div class="question-box">
        <div class="q-number">114A-3</div>
        <p>ニュルンベルグ綱領に謳われているのはどれか。1つ選べ。</p>
        <p>a: 脳死の判定　b: セカンドオピニオン　c: 倫理審査委員会の設置　d: 医師による患者情報の守秘義務　e: 人体実験における被験者の自発的同意</p>
        <div class="answer">正解: e</div>
      </div>

      <div class="question-box">
        <div class="q-number">114B-8</div>
        <p>医療専門職として患者の健康を第一に考え、人類への奉仕を宣言するのはどれか。1つ選べ。</p>
        <p>a: シドニー宣言　b: リスボン宣言　c: ジュネーブ宣言　d: ヘルシンキ宣言　e: アルマ・アタ宣言</p>
        <div class="answer">正解: c（ジュネーブ宣言）</div>
      </div>

      <h3>リスボン宣言（患者の権利）</h3>
      <ul>
        <li><span class="red">選択の自由</span>・<span class="red">自己決定</span>の権利</li>
        <li><span class="red">健康教育を受ける</span>権利</li>
        <li>情報に対する権利・守秘義務に対する権利</li>
        <li><span class="highlight">リビングウィル</span>作成の基盤</li>
        <li><span class="highlight">セカンドオピニオン</span>の根拠</li>
      </ul>

      <div class="question-box">
        <div class="q-number">116B-13</div>
        <p>リスボン宣言で述べられているのはどれか。1つ選べ。</p>
        <p>a: 死の判定　b: 健康格差の縮小　c: 国民皆保険制度　d: 倫理審査委員会の設置　e: 患者が健康教育を受ける権利</p>
        <div class="answer">正解: e</div>
      </div>

      <div class="question-box">
        <div class="q-number">113B-6</div>
        <p>リビングウィル作成の基になるのはどれか。1つ選べ。</p>
        <p>a: リスボン宣言　b: ジュネーブ宣言　c: ヘルシンキ宣言　d: アルマ・アタ宣言　e: ニュルンベルグ綱領</p>
        <div class="answer">正解: a</div>
      </div>

      <h3>インフォームド・コンセント</h3>
      <table>
        <tr><th>項目</th><th>内容</th></tr>
        <tr><td>目的</td><td class="red">患者の自己決定権の行使</td></tr>
        <tr><td>法的根拠</td><td><span class="highlight">医療法</span>（歯科医師法ではない）</td></tr>
        <tr><td>説明</td><td>医学的根拠に基づいて平易に説明</td></tr>
        <tr><td>同意後の変更</td><td><span class="highlight">可能</span>（患者はいつでも撤回可能）</td></tr>
      </table>

      <div class="question-box">
        <div class="q-number">115C-2</div>
        <p>インフォームド・コンセントで正しいのはどれか。1つ選べ。</p>
        <p>a: 歯科医師法に定められている　b: 説明文書による説明を必須とする　c: 患者が同意した後の変更はできない　d: 患者の自己決定権の行使を目的とする　e: 歯科医師が決めた治療法に対する承諾である</p>
        <div class="answer">正解: d</div>
      </div>

      <div class="question-box">
        <div class="q-number">111D-7</div>
        <p>医療法で規定されているのはどれか。1つ選べ。</p>
        <p>a: 療養方法の指導　b: 診断書交付の義務　c: 無診察治療の禁止　d: 臨床研修修了者の登録　e: インフォームド・コンセントの実施</p>
        <div class="answer">正解: e</div>
      </div>

      <div class="question-box">
        <div class="q-number">118B-11</div>
        <p>患者の自己決定権の行使を促進するのはどれか。1つ選べ。</p>
        <p>a: 医師の裁量権の拡大　b: パターナリズムの推進　c: 医療提供の効率性の確保　d: インフォームド・コンセントの取得　e: コミュニティ・オーガナイゼーションの実践</p>
        <div class="answer">正解: d</div>
      </div>

      <h3>インフォームド・アセント</h3>
      <p>判断能力が不十分な<span class="red">小児</span>に対して、理解可能な範囲で説明し賛意を得ること。</p>

      <div class="question-box">
        <div class="q-number">116C-5</div>
        <p>インフォームド・アセントが必要なのはどれか。1つ選べ。</p>
        <p>a: 小学生の患児　b: 緊急状態にある患者　c: 重度認知症患者の家族　d: 歯科医師の説明を拒否している患者　e: セカンドオピニオンを求めている患者</p>
        <div class="answer">正解: a</div>
      </div>

      <h3>セカンドオピニオン</h3>
      <p>目的：<span class="red">治療に関する患者の意思決定</span></p>
      <p>対応：<span class="highlight">治療方針の提示</span>（転医の推奨ではない）</p>

      <div class="question-box">
        <div class="q-number">115A-2</div>
        <p>セカンドオピニオンの目的はどれか。1つ選べ。</p>
        <p>a: 転院の推奨　b: 医療事故の防止　c: 医療訴訟の回避　d: 治療に関する患者の意思決定　e: 主治医による治療方針変更の根拠</p>
        <div class="answer">正解: d</div>
      </div>

      <h3>パターナリズム</h3>
      <p>医師主導の父権主義的医療。<span class="red">人権意識の高揚とともに否定</span>された。</p>

      <div class="question-box">
        <div class="q-number">113A-11</div>
        <p>医の倫理の変遷において、人権意識の高揚とともに否定されたのはどれか。1つ選べ。</p>
        <p>a: パターナリズム　b: セカンドオピニオン　c: プロフェッショナリズム　d: エンド・オブ・ライフケア　e: インフォームド・コンセント</p>
        <div class="answer">正解: a</div>
      </div>

      <h3>医療倫理の4原則</h3>
      <ul>
        <li><span class="red">自律尊重</span>（患者の自己決定を尊重）</li>
        <li>善行（患者に利益をもたらす）</li>
        <li>無危害（害を与えない）</li>
        <li>正義（公平な医療資源の分配）</li>
      </ul>

      <div class="question-box">
        <div class="q-number">112A-3</div>
        <p>医療倫理の4原則で正しいのはどれか。1つ選べ。</p>
        <p>a: 研鑽　b: 自律尊重　c: 信義誠実　d: 使命の自覚　e: 公益活動の実践</p>
        <div class="answer">正解: b</div>
      </div>

      <div class="point-box">
        <div class="point-box-title">まとめ</div>
        <ul>
          <li><span class="red">ニュルンベルグ綱領・ヘルシンキ宣言</span>＝医学研究の倫理</li>
          <li><span class="red">ジュネーブ宣言・ヒポクラテスの誓い</span>＝医師の職業倫理</li>
          <li><span class="red">リスボン宣言</span>＝患者の権利、リビングウィル、セカンドオピニオン</li>

      <h2>VI. 騒音・振動・悪臭</h2>

      <h3>騒音</h3>

        <li><span class="red">85dB</span>を超える音を聞き続けると難聴になるリスクが高まる</li>

      <ul>

      <h3>振動</h3>

      </ul>

      <h2>VII. 水の衛生</h2>

      <h3>浄水の処理（上水道）</h3>
      <p><span class="highlight">着水井 → フロック形成 → 沈殿池 → ろ過池 → 塩素消毒 → 配水池</span></p>

      <ul>

        <li><strong>高度処理</strong>：窒素、リンを除去（富栄養化・赤潮の原因となるため）</li>

        <li><strong>フミン質</strong>：植物を微生物が分解した最終分解生成物。トリハロメタンの前駆物質</li>

      <!-- ========== 根分岐部病変 ========== -->
      <h2>5. 根分岐部病変の分類</h2>

      <h3>定義</h3>
      <p>上顎の大臼歯や小臼歯、下顎の大臼歯の大多数は、多（複）根歯であり、2根もしくは3根に分岐している。この多（複）根間の根間中隔に歯周病や歯髄疾患による病変が波及した状態を根分岐部病変という。</p>

      <h3>Glickmanの分類（1958年）</h3>
      <table class="comparison-table no-break">
        <tr><th>分類</th><th>状態</th></tr>
        <tr>
          <td><span class="highlight">1級</span></td>
          <td>根分岐部に病変があるが、臨床的・エックス線的に異常を認めない</td>
        </tr>
        <tr>
          <td><span class="highlight">2級</span></td>
          <td>根分岐部の一部に歯槽骨の破壊と吸収が認められるが、歯周プローブを挿入しても根分岐部を貫通しない</td>
        </tr>
        <tr>
          <td><span class="highlight">3級</span></td>
          <td>根分岐部は歯肉で覆われているが、歯周プローブが貫通する</td>
        </tr>
        <tr>
          <td><span class="highlight">4級</span></td>
          <td>根分岐部が口腔内に露出しており、歯周プローブが貫通する</td>
        </tr>
      </table>

      <h3>Lindhe & Nymanの分類（1982年）</h3>
      <table class="comparison-table no-break">
        <tr><th>分類</th><th>水平方向の破壊程度</th><th>状態</th></tr>
        <tr>
          <td><span class="highlight">1度</span></td>
          <td>歯の幅径の<span class="red">1/3以内</span>のもの</td>
          <td>水平方向の歯周組織破壊が歯の幅径1/3を超えず、根分岐部を歯周プローブが通過しないか、わずかに入る程度</td>
        </tr>
        <tr>
          <td><span class="highlight">2度</span></td>
          <td>歯の幅径の<span class="red">1/3を超える</span>が貫通しない</td>
          <td>水平方向の歯周組織破壊が歯の幅径1/3を超えるが、根分岐部を歯周プローブが通過しないか、頬舌的あるいは近遠心的に歯周プローブが貫通するが、歯肉で覆われている</td>
        </tr>
        <tr>
          <td><span class="highlight">3度</span></td>
          <td><span class="red">完全に貫通</span></td>
          <td>完全に根分岐部の付着が破壊され、頬舌的あるいは近遠心的に歯周プローブが貫通する</td>
        </tr>
      </table>

      <div class="point-box no-break">
        <div class="point-box-title">分類の違い：Glickman vs Lindhe & Nyman</div>
        <ul>
          <li><span class="highlight">Glickman</span>：4段階（1〜4級）、歯肉の被覆状態も考慮</li>
          <li><span class="highlight">Lindhe & Nyman</span>：3段階（1〜3度）、<span class="red">水平方向の破壊程度</span>で分類</li>
          <li>国試では<span class="red">Lindhe & Nymanの分類と治療法の対応</span>が頻出</li>
        </ul>
      </div>

      <!-- ========== 根分岐部病変の治療 ========== -->

      <h3>各治療法の詳細</h3>

      <h4>ファーケーションプラスティ（根分岐部形態修正）</h4>
      <ul>
        <li><span class="highlight">オドントプラスティ</span>（歯の整形術）：根分岐部を構成するエナメル突起などの歯質を削除</li>
        <li><span class="highlight">オステオプラスティ</span>（歯槽骨整形術）：病変部歯槽骨の一部の形態を削除・修正</li>
        <li>いずれも同部の自浄性や清掃性を改善する</li>
        <li>適応：<span class="red">1度〜2度</span>の根分岐部病変</li>
      </ul>

      <h4>トンネリング（トンネル形成術）</h4>
      <ul>
        <li>歯間ブラシによる根分岐部の清掃を可能にするために、根分岐部を完全にトンネル状に貫通させる方法</li>
        <li>進行した<span class="red">2度〜3度</span>の根分岐部病変に適用され、主に<span class="highlight">下顎大臼歯</span>が対象</li>
        <li>適用するには歯根が長く、根分岐部が離開している必要がある</li>
        <li>根面齲蝕が発生しやすいので注意深いメインテナンスが必要</li>
      </ul>

      <h4>歯根分離（ルートセパレーション）</h4>
      <ul>
        <li>進行した<span class="red">2度〜3度</span>の根分岐部病変に適用される</li>
        <li><span class="highlight">下顎大臼歯</span>が主な対象で、歯冠を近遠心的に2分割して連続性を断ち、2本の単根歯として保存する</li>
        <li>通常分割した2根を連結固定して使用する場合が多い</li>
        <li>歯質のオーバーハングが残ると再発の原因となるので、フラップ手術を併用して視野を明示し、歯根の切断面が移行的になるように分離する際には注意が必要</li>
      </ul>

      <h4>歯根切除（ルートリセクション / ルートアンプテーション）</h4>
      <ul>
        <li>多（根）歯根の保存が不可能な歯根を、歯冠は削らず歯根のみ切除部で切断し、除去する治療法である</li>
        <li>一般的に<span class="highlight">上顎大臼歯</span>に行われる術式</li>
        <li>明視野下で3根のうち1根を除去する</li>
        <li>術後に歯根切除部がオーバーカントゥアにならないことが多いので、処置後のプラークコントロールには十分注意が必要</li>
      </ul>

      <h4>ヘミセクション（歯根分割抜去法）</h4>
      <ul>
        <li>一般に<span class="highlight">下顎大臼歯</span>に行われる術式で、主に2根のうち1根が保存不可能な場合に罹患歯根の歯冠部を含めて分割抜去する方法</li>
        <li>歯を2分割することから、ヘミ（半分）セクションという</li>
        <li>保存予定の歯根にはあらかじめ歯内処置を施し、必要に応じて隣在歯と固定する</li>
        <li>歯質のオーバーハングが残ると再発の原因となるので、フラップ手術を併用し、明視野下で歯根の切断面が移行的になるよう切除する際には注意が必要</li>
      </ul>

      <h4>トライセクション</h4>
      <ul>
        <li><span class="highlight">上顎大臼歯</span>に行われる術式</li>
        <li>3根から罹患歯根を歯冠を含めて分割し抜去する方法</li>
        <li>歯冠みならず歯冠部も併せて分割し抜去する方法</li>
      </ul>

      <div class="point-box no-break">
        <div class="point-box-title">上顎 vs 下顎の術式</div>
        <table>
          <tr><th>部位</th><th>主な術式</th><th>理由</th></tr>
          <tr>
            <td><span class="highlight">上顎大臼歯</span>（3根）</td>
            <td>ルートリセクション、トライセクション</td>
            <td>3根のうち1根を切除可能</td>
          </tr>
          <tr>
            <td><span class="highlight">下顎大臼歯</span>（2根）</td>
            <td>トンネリング、ルートセパレーション、ヘミセクション</td>
            <td>2根なので分離・半分切除が適応</td>
          </tr>
        </table>
      </div>

      <!-- ========== 歯周組織再生療法 ========== -->
      <h2>7. 歯周組織再生療法</h2>

      <h3>GTR法（組織再生誘導法）</h3>

      <h4>原理</h4>
      <p>GTR法 guided tissue regeneration method（組織再生誘導法）は、非吸収性膜または吸収性膜を用いて、歯肉上皮および歯肉結合組織細胞の根尖側方向への移動を阻止し、歯根膜由来の細胞を歯根面へ誘導することで新付着を形成する手術法であり、歯周組織再生療法の1つである。</p>

      <div class="point-box no-break">
        <div class="point-box-title">GTR法の生物学的原理</div>
        <ul>
          <li><span class="red">GTR法を行わない場合</span>：歯肉上皮由来細胞の移動が速く、長い上皮性付着による治癒となる</li>
          <li><span class="red">GTR法の場合</span>：GTR膜が歯肉上皮由来細胞および歯肉結合組織由来細胞の侵入を防ぐことにより、主に歯根膜由来細胞を誘導することで、<span class="highlight">結合組織性付着（新付着）</span>が得られる</li>
        </ul>
      </div>

      <h4>GTR膜の所要条件</h4>
      <ol>
        <li><span class="highlight">生体親和性</span>：歯周組織に親和性を有していること</li>
        <li><span class="highlight">細胞遮断性</span>：膜の外側では歯肉結合組織由来細胞の侵入を防ぐとともに、膜の内外での組織液・体液の交換を可能とする構造であること</li>
        <li>歯肉線維との結合：膜の表面に歯肉線維が結合することにより、歯肉退縮による膜の露出を阻止できること</li>
        <li><span class="highlight">スペースメイキング</span>：膜と根面間には歯根膜由来細胞を誘導するスペースの確保が必要となるため、適切な強度があること</li>
        <li>操作性：複雑な骨欠損形態に適合させ、膜を固定し、フラップで被覆することを可能にする臨床での操作性を有すること</li>
      </ol>

      <h4>GTR膜の種類</h4>
      <table class="comparison-table no-break">
        <tr><th>種類</th><th>利点</th><th>欠点</th></tr>
        <tr>
          <td><span class="highlight">非吸収性膜</span><br>（ePTFE膜など）</td>
          <td>・長期間にわたる細胞遮断性とスペースメイキングが期待できる<br>・二次手術における膜の除去の際、新生組織を確認できる</td>
          <td>・膜除去のための<span class="red">二次手術が必要</span>となる<br>・術後に膜の露出が生じた場合、十分な新生組織を獲得できないことがある。感染の危険性もある</td>
        </tr>
        <tr>
          <td><span class="highlight">吸収性膜</span><br>（コラーゲン膜、合成高分子膜）</td>
          <td>・1回の手術で治るため、患者および新生組織への侵襲が少ない<br>・二次手術を必要としない（比較的スペースメイキングが期待できる）</td>
          <td>・新生組織を確認することができない<br>・比較的スペースメイキングが期待しにくい</td>
        </tr>
      </table>

      <h4>GTR法の適応</h4>
      <ul>
        <li><span class="red">2、3壁性垂直性骨欠損</span>やLindhe & Nymanの根分岐部病変の分類<span class="red">1〜2度</span>が適応</li>
        <li>水平性骨吸収部位は適応外</li>
        <li>十分な角化歯肉が必要</li>
      </ul>

      <div class="question-box no-break">
        <div class="q-number">117C-42</div>
        <p>歯周組織再生療法でGTR膜の所要条件はどれか。3つ選べ。</p>
        <div class="choices">
          a: 骨形成能<br>
          b: 細胞遮断性<br>
          c: 生体親和性<br>
          d: 幹細胞の増殖促進<br>
          e: 歯肉線維との結合
        </div>
        <div class="answer">正解: B, C, E</div>
        <p class="small">GTR膜は細胞遮断性、生体親和性、歯肉線維との結合が重要。骨形成能は膜自体には不要。</p>
      </div>

      <div class="question-box no-break">
        <div class="q-number">114D-45</div>
        <p>GTR法について正しいのはどれか。3つ選べ。</p>
        <div class="choices">
          a: 結合組織性付着により治癒する<br>
          b: 歯肉上皮細胞の侵入を阻止する<br>
          c: 水平性骨吸収部位が適応となる<br>
          d: 歯根膜由来細胞の増殖を促進する<br>
          e: LindheとNymanの根分岐部病変の分類1〜2度が適応となる
        </div>
        <div class="answer">正解: A, B, E</div>
        <p class="small">GTR法は結合組織性付着（新付着）で治癒。水平性骨吸収は適応外。</p>
      </div>

      <!-- ========== EMD ========== -->
      <h3>エナメルマトリックスタンパク質（EMD / エムドゲイン）</h3>

      <h4>作用機序</h4>
      <ul>
        <li>歯の発生期に関与する重要なタンパク質で、アメロジェニン、エナメリン、シースプロテイン、アメロブラスチン、アメリンの3種類のマトリックスタンパク質と、数種類のタンパク質分解酵素がこれに含まれる</li>
        <li>歯胚象牙質形成を終えたヘルトヴィッヒ上皮鞘からも分泌される</li>
        <li>セメント質形成を促進する</li>
        <li>製剤成分の90%以上をアメロジェニンが占める</li>
      </ul>

      <h4>使用目的</h4>
      <ul>
        <li><span class="red">無細胞セメント質形成</span></li>
        <li><span class="red">固有歯槽骨再生</span></li>
        <li>歯根膜の再生（結合組織性付着の獲得）</li>
      </ul>

      <h4>適応症</h4>
      <ul>
        <li>垂直性骨欠損（特に高度な骨欠損に有用）</li>
        <li>根分岐部病変1〜2度</li>
      </ul>

      <h4>使用手順</h4>
      <ol>
        <li>フラップを剥離し、肉芽組織を除去</li>
        <li>SRPを行い根面を清掃</li>
        <li><span class="red">根面処理</span>（24%中性EDTA等）を行う</li>
        <li>生理食塩水で洗浄</li>
        <li>根面に血液が付着しないようにEMDを塗布</li>
        <li>縫合</li>
      </ol>

      <div class="question-box no-break">
        <div class="q-number">117D-27</div>
        <p>エナメルマトリックスタンパク質の使用目的はどれか。2つ選べ。</p>
        <div class="choices">
          a: 血管新生<br>
          b: 固有歯槽骨再生<br>
          c: 歯肉結合組織増殖<br>
          d: 接合上皮根尖側移動<br>
          e: 無細胞セメント質形成
        </div>
        <div class="answer">正解: B, E</div>
        <p class="small">EMDは無細胞セメント質形成と固有歯槽骨再生を促進。</p>
      </div>

      <div class="question-box no-break">
        <div class="q-number">116D-26</div>
        <p>歯周治療に用いるエナメルマトリックスタンパク質について正しいのはどれか。2つ選べ。</p>
        <div class="choices">
          a: 酸性で不溶化する<br>
          b: 主成分はエナメリンである<br>
          c: 上皮細胞の増殖を促進する<br>
          d: セメント質形成を促進する<br>
          e: 歯胚から抽出した生物由来材料である
        </div>
        <div class="answer">正解: D, E</div>
        <p class="small">EMDは幼若ブタ歯胚から抽出。主成分はアメロジェニン（エナメリンではない）。</p>
      </div>

      <!-- ========== FGF-2 ========== -->
      <h3>FGF-2製剤（リグロス）</h3>

      <h4>作用機序</h4>
      <ul>
        <li>FGF-2（fibroblast growth factor-2、塩基性線維芽細胞増殖因子）は、歯周組織を構成する細胞の増殖を促進</li>
        <li>血管新生を促進し、歯周組織の再生を誘導</li>
        <li>2016年に保険適用</li>
      </ul>

      <h4>適応症</h4>
      <ul>
        <li>垂直性骨欠損</li>
        <li>根分岐部病変</li>
      </ul>

      <div class="question-box no-break">
        <div class="q-number">118B-23</div>

        <div class="choices">
          a: GTR法<br>
          b: 新付着術<br>
          c: FGF-2製剤の応用<br>
          d: 歯周ポケット掻爬術<br>
          e: 歯肉弁根尖側移動術
        </div>
        <div class="answer">正解: A, C</div>
        <p class="small">垂直性骨欠損にはGTR法やFGF-2製剤などの再生療法が適応。</p>
      </div>

      <p>窩洞形成あるいは修復操作上、その技術的な要求から便宜的に窩洞に与えられる形態。</p>

      <ul>

        <li><span class="highlight">インレー修復の場合</span>：窩洞は抜出方向へ開放するため、窩壁を外開きに形成する</li>
        <li><span class="highlight">インレー窩洞における凸隅角の整理</span>：作業模型を製作するために窩洞の凸隅角を整理する</li>
      </ul>

          d: 咬合面窩洞にアンダーカットを付与する。<br>
          e: 咬合面に便宜形態を付与する。

        <div class="answer">正解: E</div>

          <li><span class="highlight">辺縁封鎖性の向上</span>：メタルインレー修復の場合、金合金の延性によってインレー体の辺縁圧接や、すり合わせることで封鎖性を向上させる</li>
          <li><span class="highlight">鋳造収縮によるメタルインレー体不適合の補正</span>：窩縁斜面を付与しておけば窩壁と窩縁の間に隙間が生じても辺縁を補正できる</li>
          <li><span class="highlight">歯質接着性の向上と窩縁部エナメル質の剥離防止</span>：コンポジットレジン修復では、エナメル小柱横断面の形成による酸エッチング効果の増大により接着力を向上させるとともに、レジンの重合収縮による窩縁部エナメル小柱の剥離を防ぐ効果がある</li>

      </div>

        <ul>

          <li>Cファクターが大きいほど重合収縮応力が大きくなり、接着界面の破壊リスクが高まる</li>
          <li><span class="highlight">5級窩洞</span>：5面接着/1面自由 = Cファクター5（最大）</li>

      <h2>9. 材料別窩洞形成の特徴</h2>

      <ul>
        <li>接着により保持するため<span class="highlight">機械的保持形態は不要</span></li>
        <li>遊離エナメル質は接着により補強されるため保存可能</li>
        <li>予防拡大は最小限（MI：Minimal Intervention）</li>

    const categoryOrder = ["必修01 医の倫理とプロフェッショナリズム", "必修02 社会と歯科医療", "必修03 予防と健康管理・増進", "必修04 人体の正常構造・機能", "必修05 人体の発生・成長・発達・加齢変化", "必修06 主要な疾患と障害の病因・病態", "必修07 主要症候", "必修08 診察の基本", "必修09 検査・臨床判断の基本", "必修10 初期救急", "必修11 治療の基礎・基本手技", "必修12 一般教養的事項", "総論Ⅰ 保健・医療と健康増進", "総論Ⅱ 正常構造と機能", "総論Ⅲ 病因・病態", "総論Ⅳ 主要症候", "総論Ⅴ 診察", "総論Ⅵ 検査", "総論Ⅶ 治療", "総論Ⅷ 歯科材料と歯科医療機器", "各論Ⅰ 成長・発育に関連した疾患", "各論Ⅱ 歯・歯髄・歯周組織の疾患", "各論Ⅲ 顎・口腔領域の疾患", "各論Ⅳ 歯質・歯・顎顔面欠損と機能障害", "各論Ⅴ 高齢者・有病者・障害者"];

    const mainCategories = ["必修", "総論", "各論"];
    let currentPage = null;
    let bookmarks = JSON.parse(localStorage.getItem('bookmarks') || '[]');
    let completed = JSON.parse(localStorage.getItem('completed') || '[]');
    let theme = localStorage.getItem('theme') || 'light';

    document.addEventListener('DOMContentLoaded', () => { applyTheme(); renderNavigation(); showWelcome(); updateProgress(); });

    function applyTheme() {
      document.documentElement.setAttribute('data-theme', theme);
      document.querySelector('.theme-toggle').textContent = theme === 'dark' ? '☀️' : '🌙';
    }
    function toggleTheme() { theme = theme === 'dark' ? 'light' : 'dark'; localStorage.setItem('theme', theme); applyTheme(); }

    function renderNavigation(filter = '') {
      const nav = document.getElementById('navigation');
      let html = '';

      const grouped = { "必修": {}, "総論": {}, "各論": {} };
      for (const [id, data] of Object.entries(contentData)) {
        const main = data.mainCategory;
        const cat = data.category;
        if (!grouped[main]) grouped[main] = {};
        if (!grouped[main][cat]) grouped[main][cat] = [];
        grouped[main][cat].push({ id, ...data });
      }

      const ratios = { "必修": "約22%", "総論": "約28%", "各論": "約50%" };
      const cssClass = { "必修": "hisshu", "総論": "souron", "各論": "kakuron" };

      for (const main of mainCategories) {
        if (!grouped[main] || Object.keys(grouped[main]).length === 0) continue;

        html += '<div class="nav-main-category ' + cssClass[main] + '">' + main + '<span class="ratio">' + ratios[main] + '</span></div>';

        for (const [cat, items] of Object.entries(grouped[main])) {
          const filteredItems = items.filter(item => filter === '' || item.title.toLowerCase().includes(filter.toLowerCase()));
          if (filteredItems.length === 0) continue;

          for (const item of filteredItems) {
            const isActive = currentPage === item.id ? 'active' : '';
            const isBookmarked = bookmarks.includes(item.id) ? 'active' : '';
            const isCompleted = completed.includes(item.id) ? '✓ ' : '';
            html += '<div class="nav-item ' + isActive + '" onclick="showContent(\'' + item.id + '\')">';
            html += '<span>' + isCompleted + item.title + '</span>';
            html += '<span class="bookmark ' + isBookmarked + '" onclick="event.stopPropagation(); toggleBookmark(\'' + item.id + '\')">⭐</span></div>';
          }
        }
      }
      nav.innerHTML = html;
    }

    function showWelcome() {
      const totalCount = Object.keys(contentData).length;
      const completedCount = completed.length;

      let quickLinksHtml = '';
      const samples = Object.entries(contentData).slice(0, 6);
      for (const [id, data] of samples) {
        quickLinksHtml += '<div class="quick-link" onclick="showContent(\'' + id + '\')"><h3>' + data.title + '</h3><p>' + data.category + '</p></div>';
      }

      document.getElementById('content').innerHTML =
        '<div class="welcome">' +
        '<h1>歯科医師国家試験対策</h1>' +
        '<p class="subtitle">ブループリント（国家試験設計表）に準拠した学習</p>' +
        '<div class="blueprint-info">' +
        '<h2>📊 出題割合</h2>' +
        '<div class="blueprint-row"><span class="label">必修の基本的事項</span><div class="bar"><div class="bar-fill hisshu" style="width: 22%"></div></div><span class="ratio">約22%</span></div>' +
        '<div class="blueprint-row"><span class="label">歯科医学総論</span><div class="bar"><div class="bar-fill souron" style="width: 28%"></div></div><span class="ratio">約28%</span></div>' +
        '<div class="blueprint-row"><span class="label">歯科医学各論</span><div class="bar"><div class="bar-fill kakuron" style="width: 50%"></div></div><span class="ratio">約50%</span></div>' +
        '</div>' +
        '<div class="stats">' +
        '<div class="stat"><div class="stat-num">' + totalCount + '</div><div class="stat-label">トピック</div></div>' +
        '<div class="stat"><div class="stat-num">' + completedCount + '</div><div class="stat-label">学習済み</div></div>' +
        '<div class="stat"><div class="stat-num">' + bookmarks.length + '</div><div class="stat-label">ブックマーク</div></div>' +
        '</div>' +
        '<div class="quick-links">' + quickLinksHtml + '</div>' +
        '</div>';
      document.getElementById('breadcrumb').innerHTML = 'ホーム';
      currentPage = null;
      renderNavigation();
    }

    function showContent(id) {
      const data = contentData[id];
      if (!data) return;
      currentPage = id;
      document.getElementById('content').innerHTML = '<h1>' + data.title + '</h1><div class="content-body">' + data.content + '</div><div style="margin-top: 40px; text-align: center;"><button onclick="markComplete(\'' + id + '\')" style="padding: 12px 30px; background: var(--accent); color: white; border: none; border-radius: 25px; font-size: 16px; cursor: pointer;">' + (completed.includes(id) ? '✓ 学習済み' : '学習完了にする') + '</button></div>';
      document.getElementById('breadcrumb').innerHTML = '<span style="cursor:pointer" onclick="showWelcome()">ホーム</span> / ' + data.mainCategory + ' / <span>' + data.title + '</span>';
      renderNavigation();
      closeSidebar();
      window.scrollTo(0, 0);
    }

    function markComplete(id) {
      if (completed.includes(id)) { completed = completed.filter(x => x !== id); }
      else { completed.push(id); }
      localStorage.setItem('completed', JSON.stringify(completed));
      updateProgress();
      showContent(id);
    }

    function toggleBookmark(id) {
      if (bookmarks.includes(id)) { bookmarks = bookmarks.filter(x => x !== id); }
      else { bookmarks.push(id); }
      localStorage.setItem('bookmarks', JSON.stringify(bookmarks));
      renderNavigation();
    }

    function showBookmarks() {
      if (bookmarks.length === 0) { alert('ブックマークがありません'); return; }
      let html = '<div class="welcome"><h1>⭐ ブックマーク</h1><div class="quick-links">';
      for (const id of bookmarks) {
        const data = contentData[id];
        if (data) { html += '<div class="quick-link" onclick="showContent(\'' + id + '\')"><h3>' + data.title + '</h3><p>' + data.category + '</p></div>'; }
      }
      html += '</div></div>';
      document.getElementById('content').innerHTML = html;
      document.getElementById('breadcrumb').innerHTML = '<span style="cursor:pointer" onclick="showWelcome()">ホーム</span> / <span>ブックマーク</span>';
      currentPage = null;
      renderNavigation();
    }

    function updateProgress() {
      const total = Object.keys(contentData).length;
      const done = completed.length;
      const percent = total > 0 ? Math.round((done / total) * 100) : 0;
      document.getElementById('progressFill').style.width = percent + '%';
      document.getElementById('progressText').textContent = done + '/' + total + ' 完了';
    }

    function handleSearch(query) { renderNavigation(query); }
    function toggleSidebar() { document.querySelector('.sidebar').classList.toggle('open'); document.querySelector('.overlay').classList.toggle('active'); }
    function closeSidebar() { document.querySelector('.sidebar').classList.remove('open'); document.querySelector('.overlay').classList.remove('active'); }
  </script>
</body>
