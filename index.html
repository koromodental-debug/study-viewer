<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>ココシカ - 歯科国試対策</title>
  <link rel="stylesheet" href="css/style.css?v=20260111i">
</head>
<body>
  <div class="app">
    <!-- ヘッダー -->
    <header class="header">
      <button id="menu-btn" class="header-menu-btn" aria-label="メニュー">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <h1 class="header-title">ココシカ</h1>
      <div class="header-actions">
        <button id="search-btn" class="header-icon-btn" aria-label="検索">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <path d="M21 21l-4.35-4.35"/>
          </svg>
        </button>
        <button id="theme-toggle" class="header-icon-btn" aria-label="テーマ切り替え">
        <svg class="theme-icon-light" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 3a1 1 0 011 1v1a1 1 0 11-2 0V4a1 1 0 011-1zm0 15a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zm9-6a1 1 0 01-1 1h-1a1 1 0 110-2h1a1 1 0 011 1zM5 12a1 1 0 01-1 1H3a1 1 0 110-2h1a1 1 0 011 1zm14.07-6.36a1 1 0 010 1.41l-.71.71a1 1 0 11-1.41-1.41l.71-.71a1 1 0 011.41 0zM7.05 16.95a1 1 0 010 1.41l-.71.71a1 1 0 11-1.41-1.41l.71-.71a1 1 0 011.41 0zm11.9 1.41a1 1 0 01-1.41 0l-.71-.71a1 1 0 111.41-1.41l.71.71a1 1 0 010 1.41zM7.05 7.05a1 1 0 01-1.41 0l-.71-.71a1 1 0 111.41-1.41l.71.71a1 1 0 010 1.41zM12 8a4 4 0 100 8 4 4 0 000-8z"/>
        </svg>
        <svg class="theme-icon-dark" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 3a9 9 0 109 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 01-4.4 2.26 5.403 5.403 0 01-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/>
        </svg>
        </button>
      </div>
    </header>

    <!-- フローティングお気に入りボタン（右下） -->
    <button id="note-btn" class="floating-note-btn" aria-label="ノート">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
      </svg>
      <span class="note-badge" id="note-badge" style="display:none;">0</span>
    </button>

    <!-- サイドバー -->
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-fixed">
        <div class="sidebar-header">
          <span class="sidebar-title">トピック一覧</span>
          <div class="sidebar-header-actions">
            <button id="sidebar-search-btn" class="sidebar-icon-btn" aria-label="検索">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="11" cy="11" r="8"/>
                <path d="M21 21l-4.35-4.35"/>
              </svg>
            </button>
            <button id="sidebar-close" class="sidebar-icon-btn" aria-label="閉じる">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M18 6L6 18M6 6l12 12"/>
              </svg>
            </button>
          </div>
        </div>
      </div>
      <nav class="topic-list" id="topic-list">
        <!-- 動的に生成 -->
      </nav>
    </aside>

    <!-- サイドバーオーバーレイ -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- ノートオーバーレイ -->
    <div id="note-overlay" class="note-overlay">
      <div class="note-modal">
        <div class="note-modal-header">
          <h2 class="note-modal-title">お気に入りノート</h2>
          <span class="note-count" id="note-count">0件</span>
          <button id="close-note" class="close-note-btn" aria-label="閉じる">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
          </button>
        </div>
        <div class="note-timeline" id="note-timeline">
          <!-- お気に入りカードが動的に生成される -->
          <div class="note-empty" id="note-empty">
            <div class="note-empty-icon">
              <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/>
              </svg>
            </div>
            <p class="note-empty-text">まだお気に入りがありません</p>
            <p class="note-empty-hint">各カードの★をタップして追加</p>
          </div>
        </div>
      </div>
    </div>

    <!-- 検索オーバーレイ -->
    <div id="search-overlay" class="search-overlay">
      <div class="search-modal">
        <div class="search-modal-header">
          <input type="text" id="search-input" placeholder="トピックを検索..." autofocus>
          <button id="close-search" class="close-search-btn">✕</button>
        </div>
        <div class="search-results" id="search-results">
          <!-- 検索結果 -->
        </div>
      </div>
    </div>

    <!-- 画像ライトボックス -->
    <div id="image-lightbox" class="image-lightbox">
      <button id="lightbox-close" class="lightbox-close" aria-label="閉じる">✕</button>
      <p id="lightbox-hint" class="lightbox-hint">画像を長押しして「写真に保存」を選択</p>
      <img id="lightbox-image" src="" alt="">
      <p class="lightbox-close-hint">どこかをタップして閉じる</p>
    </div>

    <!-- 目次シート -->
    <div id="toc-overlay" class="toc-overlay">
      <div class="toc-sheet">
        <div class="toc-sheet-header">
          <button id="toc-back-btn" class="toc-back-btn" style="display:none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 12H5M12 19l-7-7 7-7"/>
            </svg>
            <span>元の位置</span>
          </button>
          <h3 class="toc-sheet-title">目次</h3>
          <button id="toc-close-btn" class="toc-close-btn" aria-label="閉じる">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
          </button>
        </div>
        <div class="toc-search-wrapper">
          <input type="text" id="toc-search-input" class="toc-search-input" placeholder="見出しを検索...">
        </div>
        <div class="toc-list" id="toc-list">
          <!-- 動的に生成 -->
        </div>
      </div>
    </div>

    <!-- フローティング目次ボタン -->
    <button id="toc-fab" class="toc-fab" aria-label="目次" style="display:none;">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/>
      </svg>
    </button>

    <!-- 読書モード（Aa）ボタン -->
    <button id="reading-mode-btn" class="reading-mode-btn" aria-label="表示設定" style="display:none;">
      <span>Aa</span>
    </button>

    <!-- 読書モードメニュー -->
    <div id="reading-mode-overlay" class="reading-mode-overlay">
      <div class="reading-mode-sheet">
        <div class="reading-mode-header">
          <h3>表示設定</h3>
          <button id="reading-mode-close" class="reading-mode-close" aria-label="閉じる">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 6L6 18M6 6l12 12"/>
            </svg>
          </button>
        </div>

        <div class="reading-mode-section">
          <div class="reading-mode-label">文字サイズ</div>
          <div class="reading-mode-font-controls">
            <button id="font-decrease" class="font-btn">A−</button>
            <span id="font-size-display" class="font-size-display">標準</span>
            <button id="font-increase" class="font-btn">A+</button>
          </div>
        </div>

        <div class="reading-mode-section">
          <div class="reading-mode-label">行間</div>
          <div class="reading-mode-toggle-group">
            <button class="reading-toggle" data-line-height="compact">狭い</button>
            <button class="reading-toggle active" data-line-height="normal">標準</button>
            <button class="reading-toggle" data-line-height="wide">広い</button>
          </div>
        </div>

        <div class="reading-mode-section">
          <div class="reading-mode-label">表示密度</div>
          <div class="reading-mode-toggle-group">
            <button class="reading-toggle" data-density="compact">コンパクト</button>
            <button class="reading-toggle active" data-density="normal">標準</button>
          </div>
        </div>
      </div>
    </div>

    <!-- 前の見出しへボタン -->
    <button id="prev-heading-btn" class="prev-heading-btn" aria-label="前の見出しへ" style="display:none;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M12 19V5M5 12l7-7 7 7"/>
      </svg>
    </button>

    <!-- メインコンテンツ -->
    <main class="main-content">
      <div class="content-area">
        <div class="tab-content" id="html-content">
          <div class="welcome-screen" id="welcome-screen">
            <div class="welcome-header">
              <h1 class="welcome-title">ココシカ</h1>
              <p class="welcome-subtitle">歯科国試対策</p>
            </div>

            <div class="welcome-cards">
              <div class="welcome-card" id="welcome-card-menu">
                <div class="welcome-card-icon">
                  <div class="welcome-icon-menu">
                    <span></span>
                    <span></span>
                    <span></span>
                  </div>
                </div>
                <div class="welcome-card-content">
                  <h3>トピックを選ぶ</h3>
                  <p>左上のメニューから<br>学習したいトピックを選択</p>
                </div>
              </div>

              <div class="welcome-card">
                <div class="welcome-card-icon">
                  <span class="welcome-icon-tab">まとめ</span>
                </div>
                <div class="welcome-card-content">
                  <h3>まとめで学ぶ</h3>
                  <p>まとめ資料で<br>知識をインプット</p>
                </div>
              </div>

              <div class="welcome-card">
                <div class="welcome-card-icon">
                  <span class="welcome-icon-tab">Q&A</span>
                </div>
                <div class="welcome-card-content">
                  <h3>Q&Aで確認</h3>
                  <p>一問一答形式で<br>理解度をチェック</p>
                </div>
              </div>

              <div class="welcome-card">
                <div class="welcome-card-icon">
                  <span class="welcome-icon-tab">過去問</span>
                </div>
                <div class="welcome-card-content">
                  <h3>過去問に挑戦</h3>
                  <p>国試過去問で<br>実力をテスト</p>
                </div>
              </div>
            </div>

            <div class="welcome-tips">
              <p>← スワイプでタブ切り替え →</p>
            </div>

            <button class="welcome-start-btn" id="welcome-start-btn">
              はじめる
            </button>
          </div>
          <div id="html-display" class="html-display" style="display:none;"></div>
        </div>
        <!-- QA機能用ダミー要素（後方互換性のため非表示で残す） -->
        <div class="tab-content" id="qa-content" style="display:none;">
          <div class="placeholder"><p></p></div>
          <div id="qa-toolbar" class="qa-toolbar" style="display:none;"></div>
          <div id="qa-display" class="qa-display" style="display:none;"></div>
        </div>
        <div class="tab-content" id="kakomon-content">
          <div class="placeholder" id="kakomon-placeholder">
            <p>過去問を表示するにはトピックを選択</p>
          </div>
          <div id="kakomon-toolbar" class="kakomon-toolbar" style="display:none;">
            <span class="kakomon-progress"><span id="kakomon-current">0</span> / <span id="kakomon-total">0</span></span>
            <button id="kakomon-reset" class="kakomon-btn">リセット</button>
          </div>
          <div id="kakomon-display" class="kakomon-display" style="display:none;"></div>
        </div>
        <div class="tab-content active" id="flashcard-content">
          <!-- 動的に生成 -->
        </div>
      </div>
    </main>

    <!-- フローティングタブバー -->
    <nav class="floating-tabbar">
      <!-- Q&Aトグルボタン（タブバーの上に出現） -->
      <button id="qa-floating-toggle" class="qa-floating-toggle">
        <span>全て表示</span>
      </button>
      <button class="floating-tab active" data-tab="flashcard">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/>
        </svg>
        <span>演習</span>
      </button>
      <button class="floating-tab" data-tab="html">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M6 2C4.9 2 4 2.9 4 4v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6H6zm7 7V3.5L18.5 9H13z"/>
        </svg>
        <span>まとめ</span>
      </button>
      <button class="floating-tab" data-tab="kakomon">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="currentColor">
          <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
        </svg>
        <span>過去問</span>
      </button>
    </nav>

  </div>

  <!-- 検索シート（モーダル） -->
  <div id="search-sheet" class="search-sheet">
    <div class="search-sheet-backdrop"></div>
    <div class="search-sheet-content">
      <div class="search-sheet-header">
        <div class="search-sheet-input-wrap">
          <svg class="search-sheet-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/>
            <path d="M21 21l-4.35-4.35"/>
          </svg>
          <input type="text" id="search-sheet-input" class="search-sheet-input" placeholder="デッキ・用語を検索">
          <button id="search-sheet-clear" class="search-sheet-clear" style="display:none;">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 2C6.47 2 2 6.47 2 12s4.47 10 10 10 10-4.47 10-10S17.53 2 12 2zm5 13.59L15.59 17 12 13.41 8.41 17 7 15.59 10.59 12 7 8.41 8.41 7 12 10.59 15.59 7 17 8.41 13.41 12 17 15.59z"/>
            </svg>
          </button>
        </div>
        <button id="search-sheet-cancel" class="search-sheet-cancel">キャンセル</button>
      </div>
      <div class="search-sheet-body">
        <div id="search-sheet-initial" class="search-sheet-initial">
          <!-- 初期表示：最近・候補 -->
        </div>
        <div id="search-sheet-results" class="search-sheet-results" style="display:none;">
          <!-- 検索結果 -->
        </div>
      </div>
    </div>
  </div>

  <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
  <script src="js/data.js?v=20260110m"></script>
  <script src="js/search.js?v=20260110m"></script>
  <script src="js/favorites.js?v=20260110m"></script>
  <script src="js/kakomon.js?v=20260110m"></script>
  <script src="js/flashcard.js?v=20260111e"></script>
  <script src="js/app.js?v=20260111e"></script>
</body>
</html>
