<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Viewer - 国試対策</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <!-- サイドバー -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h1>Study Viewer</h1>
        <button id="search-btn" class="search-btn">
          <span class="search-icon">🔍</span>
          <span>検索</span>
          <span class="shortcut">⌘K</span>
        </button>
      </div>
      <nav class="topic-list" id="topic-list">
        <!-- 動的に生成 -->
      </nav>
    </aside>

    <!-- 検索オーバーレイ -->
    <div id="search-overlay" class="search-overlay" style="display:none;">
      <div class="search-modal">
        <div class="search-modal-header">
          <input type="text" id="search-input" placeholder="トピックを検索..." autofocus>
          <button id="close-search" class="close-search-btn">✕</button>
        </div>
        <div class="search-results" id="search-results">
          <!-- 検索結果 -->
        </div>
      </div>
    </div>

    <!-- メインコンテンツ -->
    <main class="main-content">
      <div class="tabs">
        <button class="tab active" data-tab="html">HTML</button>
        <button class="tab" data-tab="qa">Q&A</button>
      </div>
      <div class="content-area">
        <div class="tab-content active" id="html-content">
          <div class="placeholder">
            <p>左のリストからトピックを選択してください</p>
          </div>
          <iframe id="html-frame" style="display:none;"></iframe>
        </div>
        <div class="tab-content" id="qa-content">
          <div class="placeholder">
            <p>左のリストからトピックを選択してください</p>
          </div>
          <div id="qa-display" class="qa-display" style="display:none;"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="js/data.js"></script>
  <script src="js/search.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
